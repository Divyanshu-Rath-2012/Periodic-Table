name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==0.84.0"
          echo "flet==0.84.0" > requirements.txt
          
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2' # Stable version for Flet 0.84.0
          cache: true # Speeds up the build to avoid 45s hang

      - name: Build APK (Non-Interactive)
        run: |
          # The --no-rich-output flag helps bypass terminal-based hangs
          flet build apk --no-rich-output --verbose
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: periodic-table-apk
          path: build/apk/*.apk
