name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Flet Build Tools
        run: |
          python -m pip install --upgrade pip
          # [all] ensures packaging tools are included
          pip install "flet[all]==0.84.0"
          # Force create requirements.txt in the build root
          echo "flet==0.84.0" > requirements.txt
          
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2' # Stable version for Flet 0.84.0

      - name: Pre-accept Android Licenses
        # This bypasses the EOFError by auto-answering 'y' to license prompts
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          # --verbose helps identify hidden errors if it stops again
          flet build apk --verbose
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: periodic-table-apk
          path: build/apk/*.apk
