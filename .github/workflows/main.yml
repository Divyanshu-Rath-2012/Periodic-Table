name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          pip install "flet[all]==0.84.0"
          echo "flet==0.84.0" > requirements.txt

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # This specific version is the most stable for Flet builds
          flutter-version: '3.19.0' 

      - name: Bypassing EOFError (Auto-License)
        run: |
          # This command manually forces 'yes' into the Android SDK manager
          mkdir -p $ANDROID_HOME/licenses
          echo -e "24333f8a63b6b395014864b019a185967675f91f\n84831b9409646a918e30573bab4c9c91346d8abd\n504663220467295ee47873523e9146993a7aca24\n4938363733363435333633343339363533353435" > $ANDROID_HOME/licenses/android-sdk-license
          yes | sdkmanager --licenses || true

      - name: Build APK (Silent Mode)
        run: |
          # --no-rich-output is the most important flag to stop the hang
          flet build apk --verbose --no-rich-output --no-version-check

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: periodic-table-apk
          path: build/apk/*.apk
