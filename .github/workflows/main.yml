name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Flet
        run: |
          pip install "flet[all]==0.84.0"
          echo "flet==0.84.0" > requirements.txt
          
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'

      - name: Accept Licenses & Build
        # "yes |" pipe answers "y" to all prompts automatically
        run: |
          yes | sdkmanager --licenses || true
          flet build apk --verbose --no-interactive
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: periodic-table-apk
          path: build/apk/*.apk
