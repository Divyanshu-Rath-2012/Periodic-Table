name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Use 3.11 for maximum stability with Flet 0.84.0
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.84.0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2' # Critical: Matches Flet 0.84.0
      - name: Build APK
        run: |
          # Use --verbose to see the exact line where it fails if the Red Cross returns
          flet build apk --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: periodic-table-apk
          path: build/apk/*.apk
